<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Vibrant Edge Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#9b51e0"/>
      <stop offset="100%" stop-color="#ff2a85"/>
    </linearGradient>

    <!-- Top to bottom background subtle glow -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0c24"/>
      <stop offset="100%" stop-color="#04020a"/>
    </linearGradient>

    <!-- Glow Filter for SVG Favicon -->
    <filter id="tabGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark rounded background squircle for high contrast in all browser tabs (dark & light) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#232042" stroke-width="1.5"/>

  <!-- Hexagon Shape (Centered at 32, 32, Radius ~22) -->
  <!-- Top: (32, 10), Top-Right: (51, 21), Bot-Right: (51, 43), Bot: (32, 54), Bot-Left: (13, 43), Top-Left: (13, 21) -->
  <polygon points="32,10 51,21 51,43 32,54 13,43 13,21"
           fill="rgba(15, 12, 36, 0.6)"
           stroke="url(#neonGrad)"
           stroke-width="3.5"
           stroke-linejoin="round"
           filter="url(#tabGlow)"/>

  <!-- Circuit nodes on corners -->
  <circle cx="32" cy="10" r="2.2" fill="#00f2fe"/>
  <circle cx="51" cy="21" r="2.2" fill="#00f2fe"/>
  <circle cx="51" cy="43" r="2.2" fill="#ff2a85"/>
  <circle cx="32" cy="54" r="2.2" fill="#ff2a85"/>
  <circle cx="13" cy="43" r="2.2" fill="#ff2a85"/>
  <circle cx="13" cy="21" r="2.2" fill="#9b51e0"/>

  <!-- Terminal Symbol ">_" (Bold & crisp for 16px tab icon legibility) -->
  <!-- ">" Chevron -->
  <path d="M21 25 L29 32 L21 39"
        stroke="#ffffff"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#tabGlow)"/>

  <!-- "_" Underscore -->
  <line x1="33" y1="39" x2="43" y2="39"
        stroke="#00f2fe"
        stroke-width="3.5"
        stroke-linecap="round"
        filter="url(#tabGlow)"/>
</svg>