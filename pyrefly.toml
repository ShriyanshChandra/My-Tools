# Pyrefly type checker configuration
# https://github.com/facebook/pyrefly

# Pin the interpreter to the project's venv Python 3.12 binary.
# This prevents Pyrefly from falling back to the Homebrew system Python 3.14.
python_interpreter = ".venv/bin/python3.12"

# Explicitly include the venv site-packages so Pyrefly can resolve
# third-party modules (numpy, sounddevice, websockets, scipy).
site_package_path = [
  ".venv/lib/python3.12/site-packages"
]

# Only type-check the server Python files
include = ["server/**/*.py"]
